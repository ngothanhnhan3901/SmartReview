<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ôn thi thông minh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F7; --paper:#FFFFFF; --ink:#18213A; --muted:#5B6683; --line:#D5DBE8;
  --blue:#2B4BA8; --blue-soft:#E4EAFA;
  --mark:#FFE36B; --mark-soft:#FFF6CC;
  --ok:#1C8657; --ok-soft:#DDF3E8; --bad:#BE3A3A; --bad-soft:#FBE3E3;
  --claude:#7A3FB0; --claude-soft:#EFE3FA;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#10162A; --paper:#19213A; --ink:#E7EBF7; --muted:#9AA5C4; --line:#2C365A;
    --blue:#8DA6F5; --blue-soft:#222C55;
    --mark:#F3D23E; --mark-soft:#3A3416;
    --ok:#52D39A; --ok-soft:#173A2D; --bad:#FF8A8A; --bad-soft:#431F25;
    --claude:#C79BF2; --claude-soft:#33224A;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.6}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
header.top{background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
.top .wrap{padding-top:12px;padding-bottom:0}
h1{font-size:1.15rem;margin:0 0 10px;font-weight:700;letter-spacing:-.01em}
.main-tabs{display:flex;gap:4px}
.main-tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:10px 8px;font-weight:600;color:var(--muted)}
.main-tabs button[aria-selected=true]{color:var(--blue);border-bottom-color:var(--blue)}
.subj-bar{background:var(--bg);border-bottom:1px solid var(--line)}
.subj-tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 0}
.subj-tabs button{white-space:nowrap;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:5px 16px;font-weight:500}
.subj-tabs button[aria-selected=true]{background:var(--blue);border-color:var(--blue);color:#fff}
@media (prefers-color-scheme: dark){.subj-tabs button[aria-selected=true]{color:#10162A}}
main{padding:18px 0 80px}
.source{color:var(--muted);font-size:.88rem;margin:0 0 12px}
.note{border-left:4px solid var(--claude);background:var(--claude-soft);padding:10px 14px;border-radius:0 8px 8px 0;margin:0 0 16px;font-size:.92rem}
.note.green{border-left-color:var(--ok);background:var(--ok-soft)}
.tag-claude{display:inline-block;background:var(--claude-soft);color:var(--claude);border:1px solid var(--claude);font-size:.78rem;font-weight:600;border-radius:6px;padding:0 7px;margin-left:6px;vertical-align:middle}
.tag-src{display:inline-block;background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok);font-size:.78rem;font-weight:600;border-radius:6px;padding:0 7px;margin-left:6px;vertical-align:middle}
.scorebar{position:sticky;top:101px;z-index:10;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin:0 0 18px;box-shadow:0 2px 8px rgba(24,33,58,.08)}
.scorebar .stat{font-weight:600}
.scorebar .stat span{color:var(--blue)}
.scorebar .sp{flex:1}
.btn{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px 14px;font-weight:500}
.btn:hover{border-color:var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
@media (prefers-color-scheme: dark){.btn.primary{color:#10162A}}
h2.part{font-size:1.05rem;margin:26px 0 4px;padding-bottom:6px;border-bottom:2px solid var(--ink)}
p.part-desc{margin:0 0 14px;color:var(--muted);font-size:.9rem;white-space:pre-line}
mark{background:var(--mark);color:inherit;padding:0 3px;border-radius:3px}
.wbtns{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.wbtns .btn{font-size:.85rem;padding:4px 10px}
.wtext{white-space:pre-line;line-height:1.8}
.cloze-in{font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:6px;padding:0 6px;margin:0 2px}
.cloze-in.ok{border-color:var(--ok);background:var(--ok-soft)}
.cloze-in.bad{border-color:var(--bad);background:var(--bad-soft)}
.wtextarea{width:100%;font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;resize:vertical}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px 16px 14px;margin:0 0 14px}
.card .qno{font-weight:700;color:var(--blue)}
.qtext{margin:0 0 12px;white-space:pre-line}
pre.tree{background:var(--bg);border-radius:8px;padding:10px 12px;margin:0 0 12px;overflow-x:auto;font-family:ui-monospace,Consolas,monospace;font-size:.9rem;line-height:1.5}
.answer-label{margin:0 0 4px;font-weight:600}
.pl{white-space:pre-line}
.titlebtns{display:flex;gap:6px}
.dropzone{border:2px dashed var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--muted);margin:0 0 10px}
.dropzone.over{border-color:var(--blue);background:var(--blue-soft)}
.implog{max-height:220px;overflow:auto;font-size:.88rem;line-height:1.6;font-family:ui-monospace,Consolas,monospace}
.draft-banner{border-left-color:var(--mark);background:var(--mark-soft)}
.srcref{font-size:.82rem;font-style:italic}
.dh-text{font-family:Georgia,"Times New Roman",serif;line-height:1.9;background:var(--bg);border-radius:10px;padding:12px 16px;margin:0 0 8px}
.dh-text p{margin:0 0 .6em}
.dh-text.poem p{margin:0 0 .15em;padding-left:1.2em}
.dh-src{font-style:italic}

.dh-notes p{margin:2px 0}

.dh-part{display:flex;gap:8px;align-items:flex-start;margin:6px 0}
.dh-part input{margin-top:.45em}
.dh-tip{margin-top:6px}
.tip-row{border-top:1px solid var(--line);padding-top:6px;margin-top:6px}
.dh-total{font-weight:600}
.dh-total span{color:var(--blue)}
.blank{display:inline-block;border-bottom:2px solid var(--muted);padding:0 6px;margin:0 2px;border-radius:4px;font-weight:600}
.blank.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.blank.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.blank.rev{background:var(--mark-soft);border-color:var(--mark)}
.passage{background:var(--bg);border-radius:10px;padding:10px 14px;margin:0 0 14px}
.ptext{margin:0 0 8px;line-height:1.75}
.qblock{border-top:1px solid var(--line);padding:10px 0 4px}
.qa-ok{border-color:var(--ok)}
.qa-no{border-color:var(--bad)}
.tbl{border-collapse:collapse;margin:0 0 12px;width:100%;font-size:.94rem}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 10px;text-align:left;min-height:1.6em;height:2em}
.tbl th{background:var(--blue-soft)}
.warn{background:var(--claude-soft);border-left:4px solid var(--claude);padding:8px 12px;border-radius:0 8px 8px 0;font-size:.92rem}
.sa-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sa-input{font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:7px 12px;width:9em}
.sa-input:disabled{background:var(--bg)}
.card .note{margin:0 0 12px}
.ctx{background:var(--bg);border-radius:8px;padding:10px 12px;margin:0 0 12px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;text-align:left;width:100%;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;align-items:flex-start}

.opt .letter{font-weight:700;min-width:1.4em}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.faded{opacity:.6}
.result{margin:10px 0 0;font-weight:600}
.result.ok{color:var(--ok)} .result.bad{color:var(--bad)}
.tools{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.hint-btn{background:var(--mark-soft);border:1px solid var(--mark);border-radius:8px;padding:4px 12px;font-size:.9rem;font-weight:500}
.hint{margin-top:10px;background:var(--mark-soft);border-left:4px solid var(--mark);padding:10px 12px;border-radius:0 8px 8px 0;font-size:.94rem}
.hint small{display:block;color:var(--muted);margin-top:4px}
.tf-row{border-top:1px solid var(--line);padding:12px 0 6px}
.tf-row:first-of-type{border-top:0}
.tf-line{display:flex;gap:10px;align-items:flex-start}
.tf-line .lbl{font-weight:700;min-width:1.4em}
.tf-text{flex:1}
.tf-btns{display:flex;gap:6px;margin-top:8px;margin-left:calc(1.4em + 10px);flex-wrap:wrap;align-items:center}
.tf-btns .opt{width:auto;padding:5px 18px;font-weight:600;justify-content:center}
.answer-list{margin:8px 0 0;padding-left:1.2em}
.answer-list li{margin:3px 0}
.answer-box{margin-top:12px;border:1px solid var(--ok);background:var(--ok-soft);border-radius:10px;padding:10px 14px}
.answer-box p{margin:6px 0}
.answer-box.own{border-color:var(--claude);background:var(--claude-soft)}
.empty{text-align:center;color:var(--muted);padding:40px 0}
@media (max-width:560px){.scorebar{top:97px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

.titlebar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 10px}
.titlebar h1{margin:0}
#editToggle{padding:3px 14px;font-size:.88rem;white-space:nowrap}

.edit-btn:hover{border-color:var(--blue);color:var(--blue)}
.edit-form{border:2px solid var(--blue)}
.edit-sub{border-top:1px solid var(--line);padding-top:10px;margin-top:6px}
.fld{display:block;margin:0 0 10px}
.fld-l{display:block;font-size:.85rem;color:var(--muted);margin-bottom:2px}

.fld-check{display:flex;gap:8px;align-items:center}
#editbar .note{margin:0 0 14px}
#editbar small{display:block;margin-top:6px;color:var(--muted)}

html{font-size:var(--fs,18px)}
body{font-size:1rem;line-height:1.7;--read:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body.serif{--read:Georgia,"Noto Serif","Times New Roman",serif}
:root{--ink:#0B1220;--muted:#46506A;--line:#C3CBDD}

textarea,.wtextarea{font-size:1.05rem;line-height:1.7}

<body>
<header class="top">
  <div class="wrap">
    <div class="titlebar"><h1>Ôn thi thông minh</h1><span class="titlebtns"><button class="btn" id="importToggle" type="button">＋ Thêm đề</button><button class="btn" id="editToggle" type="button">✎ Chỉnh sửa</button></span></div>
    <div class="main-tabs" role="tablist" id="mainTabs"></div>
  </div>
  <div class="subj-bar"><div class="wrap"><div class="subj-tabs" role="tablist" id="subjTabs"></div></div></div>
</header>
<main><div class="wrap" id="editbar"></div><div class="wrap" id="panel"></div></main>

<script id="app">
/* =====================================================================
   DỮ LIỆU — thêm môn mới bằng cách thêm 1 object vào mảng SUBJECTS.
   - mcq:  { q, opts:[A,B,C,D], ans:"A", hint }
   - tf:   { head, ctx, items:[{ t, ans:true|false, hint }] }
   - essay:{ head, q, qNote (câu hỏi in nghiêng), a:[...], own:true nếu do Claude tự làm }
   Văn bản câu hỏi/đáp án sao chép nguyên văn từ đề cương (kể cả lỗi chính tả).
   ===================================================================== */
const SUBJECTS = [
];

/* ============================ ỨNG DỤNG ============================ */
const rich=str=>{
  if(str.indexOf("$")<0)return document.createTextNode(str);
  const f=document.createDocumentFragment();
  str.split(/(\$[^$]+\$)/).forEach(part=>{
    if(part.length>2&&part[0]==="$"&&part[part.length-1]==="$"){
      part.slice(1,-1).split(/(_[A-Za-z0-9])/).forEach(q=>{
        if(/^_[A-Za-z0-9]$/.test(q)){const sb=document.createElement("sub");sb.textContent=q[1];f.append(sb)}
        else f.append(document.createTextNode(q));
      });
    }else f.append(document.createTextNode(part));
  });
  return f;
};
const h=(tag,attrs={},...kids)=>{
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){
    if(k==="class")e.className=v;
    else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);
    else if(v===true)e.setAttribute(k,"");
    else if(v!==false&&v!=null)e.setAttribute(k,v);
  }
  kids.flat().forEach(c=>{ if(c==null||c===false)return; e.append(c instanceof Node?c:(typeof c==="string"?rich(c):document.createTextNode(c))); });
  return e;
};
const shuffled=n=>{const a=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const seq=n=>[...Array(n).keys()];
const LET=["A","B","C","D"];

/* ======================= CHỈNH SỬA ======================= */
const STORE_KEY="onthi-edits:"+document.title;
let editMode=false, lastStatus="";
const editing=new Set(), savers=new Map();

(function loadStored(){
  try{
    const raw=localStorage.getItem(STORE_KEY);
    if(!raw)return;
    JSON.parse(raw).forEach(sv=>{
      const i=SUBJECTS.findIndex(x=>x.id===sv.id);
      if(i>=0)SUBJECTS[i]=sv;else SUBJECTS.push(sv);
    });
  }catch(e){}
})();

function persist(){
  try{localStorage.setItem(STORE_KEY,JSON.stringify(SUBJECTS.filter(x=>!x.draft)));return true}catch(e){return false}
}
function setStatus(t){
  lastStatus=t;
  const el=document.getElementById("editStatus");
  if(el)el.textContent=t;
}
function savedMsg(){
  const d=new Date(), hh=String(d.getHours()).padStart(2,"0"), mm=String(d.getMinutes()).padStart(2,"0");
  return persist()
    ? `Đã lưu lúc ${hh}:${mm}.`
    : "Đã sửa, nhưng trình duyệt này không tự lưu được. Hãy bấm \"Tải file đã sửa\" để giữ lại chỉnh sửa.";
}
function flushEdits(){
  if(!savers.size)return;
  for(const [k,fn] of [...savers.entries()]){fn();savers.delete(k);editing.delete(k)}
  setStatus(savedMsg());
}
function toggleEdit(){
  if(!editMode){
    editMode=true;
  }else{
    for(const fn of [...savers.values()])fn();
    savers.clear();editing.clear();
    setStatus(savedMsg());
    editMode=false;
  }
  updateEditUI();
  renderPanel();
}
function updateEditUI(){
  const b=document.getElementById("editToggle");
  b.textContent=editMode?"✔ Lưu và khoá":"✎ Chỉnh sửa";
  b.className="btn"+(editMode?" primary":"");
  b.setAttribute("aria-pressed",String(editMode));
  const bar=document.getElementById("editbar");
  if(!editMode){bar.replaceChildren();return}
  bar.replaceChildren(h("div",{class:"note edit-note"},
    h("strong",{},"Đang ở chế độ chỉnh sửa. "),
    "Bấm nút nhỏ \"✎ Sửa\" ở cuối mỗi câu để sửa câu hỏi, đáp án, gợi ý. Sửa xong bấm \"Lưu câu này\", rồi bấm nút \"✔ Lưu và khoá\" ở góc trên để khoá lại.",
    h("div",{class:"tools"},
      h("button",{class:"btn",onclick:exportHtml},"Tải file đã sửa (.html)"),
      h("button",{class:"btn",onclick:resetAll},"Bỏ mọi chỉnh sửa")),
    h("small",{id:"editStatus"},lastStatus)));
}
function exportHtml(){
  flushEdits();
  const code=document.getElementById("app").textContent;
  const a=code.indexOf("const SUBJECTS = [");
  const marker="\n];\n\n/* ============================ ỨNG DỤNG";
  const b=code.indexOf(marker);
  if(a<0||b<0){alert("Không tạo được file. Hãy thử lại.");return}
  const newCode=code.slice(0,a)+"const SUBJECTS = "+JSON.stringify(SUBJECTS.filter(x=>!x.draft),null,1)+";"+code.slice(b+3);
  const clone=document.documentElement.cloneNode(true);
  ["panel","mainTabs","subjTabs","editbar"].forEach(id=>clone.querySelector("#"+id).replaceChildren());
  clone.querySelector("#editToggle").textContent="✎ Chỉnh sửa";
  clone.querySelector("#editToggle").className="btn";
  clone.querySelector("#app").textContent=newCode;
  const html="<!DOCTYPE html>\n"+clone.outerHTML;
  const url=URL.createObjectURL(new Blob([html],{type:"text/html;charset=utf-8"}));
  const link=document.createElement("a");
  link.href=url;link.download="on-thi-da-sua.html";
  document.body.append(link);link.click();link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);

function bufToB64(buf){
  const bytes=new Uint8Array(buf);let bin="";const CH=0x8000;
  for(let i=0;i<bytes.length;i+=CH)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+CH));

}
async function imgToB64(file){

    const MAX=2200, sc=Math.min(1,MAX/Math.max(img.naturalWidth,img.naturalHeight));
    const cv=document.createElement("canvas");cv.width=Math.round(img.naturalWidth*sc);cv.height=Math.round(img.naturalHeight*sc);

}

/* DOCX: tự giải nén (không cần thư viện) và lấy chữ, đánh dấu chữ in đậm bằng ** */
async function unzipEntry(buf,wanted){
  const dv=new DataView(buf), u8=new Uint8Array(buf);
  let eocd=-1;
  for(let i=u8.length-22;i>=Math.max(0,u8.length-70000);i--){if(dv.getUint32(i,true)===0x06054b50){eocd=i;break}}
  if(eocd<0)throw new Error("File Word không hợp lệ (không phải .docx).");
  const n=dv.getUint16(eocd+10,true);let p=dv.getUint32(eocd+16,true);
  const dec=new TextDecoder("utf-8");
  for(let k=0;k<n;k++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    const method=dv.getUint16(p+10,true),csize=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lho=dv.getUint32(p+42,true);
    const name=dec.decode(u8.subarray(p+46,p+46+nl));
    if(name===wanted){
      const lnl=dv.getUint16(lho+26,true),lel=dv.getUint16(lho+28,true),start=lho+30+lnl+lel;
      const data=u8.subarray(start,start+csize);
      if(method===0)return dec.decode(data);
      if(method===8){
        const ab=await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer();
        return dec.decode(ab);
      }
      throw new Error("Kiểu nén trong file Word chưa hỗ trợ.");
    }
    p+=46+nl+el+cl;
  }
  throw new Error("Không tìm thấy nội dung trong file Word.");
}
async function docxToText(file){
  const buf=await readBuf(file);
  const xml=await unzipEntry(buf,"word/document.xml");
  const doc=new DOMParser().parseFromString(xml,"application/xml");
  const W="http://schemas.openxmlformats.org/wordprocessingml/2006/main";
  const q=(el,tag)=>Array.from(el.getElementsByTagNameNS(W,tag));
  function paraText(p){
    let out="",cur="",bold=false;
    const flush=()=>{if(cur){out+=bold&&cur.trim()?"**"+cur+"**":cur;cur=""}};
    const walk=node=>{
      for(const c of Array.from(node.childNodes)){
        if(c.namespaceURI!==W)continue;
        if(c.localName==="r"){
          const rp=Array.from(c.childNodes).find(x=>x.localName==="rPr");
          const b=rp&&Array.from(rp.childNodes).find(x=>x.localName==="b");
          const isB=!!b&&!["0","false"].includes(b.getAttributeNS(W,"val")||"");
          if(isB!==bold){flush();bold=isB}
          for(const t of Array.from(c.childNodes)){
            if(t.localName==="t")cur+=t.textContent;
            else if(t.localName==="tab")cur+="\t";
            else if(t.localName==="br")cur+="\n";
          }
        }else if(["hyperlink","smartTag","sdt","sdtContent","ins"].includes(c.localName))walk(c);
      }
    };
    walk(p);flush();
    return out.replace(/\*\*\s*\*\*/g,"");
  }
  const body=doc.getElementsByTagNameNS(W,"body")[0];
  const lines=[];
  for(const c of Array.from(body.childNodes)){
    if(c.localName==="p")lines.push(paraText(c));
    else if(c.localName==="tbl"){
      for(const tr of q(c,"tr")){
        const cells=Array.from(tr.childNodes).filter(x=>x.localName==="tc").map(tc=>q(tc,"p").map(paraText).join(" ").trim());
        lines.push(cells.join(" | "));
      }
    }
  }
  return lines.join("\n").replace(/\n{3,}/g,"\n\n").trim();
}

/* PDF: đọc lớp chữ bằng pdf.js (tải khi cần); nếu là ảnh scan thì gửi thẳng PDF cho Gemini */
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error("Không tải được "+src));document.head.append(s)})}
async function pdfToText(file){
  if(!window.pdfjsLib){
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");
    window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  }
  const pdf=await window.pdfjsLib.getDocument({data:await readBuf(file)}).promise;
  let all="",chars=0;
  for(let i=1;i<=pdf.numPages;i++){
    const tc=await (await pdf.getPage(i)).getTextContent();
    const rows={};
    tc.items.forEach(it=>{const y=Math.round(it.transform[5]/3);(rows[y]=rows[y]||[]).push(it)});
    const lines=Object.keys(rows).map(Number).sort((a,b)=>b-a).map(y=>rows[y].sort((a,b)=>a.transform[4]-b.transform[4]).map(x=>x.str).join(" ").replace(/\s+/g," ").trim()).filter(Boolean);
    chars+=lines.join("").length;
    all+=`\n[Trang ${i}]\n`+lines.join("\n");
  }
  return {text:all.trim(),pages:pdf.numPages,scanned:chars<40*pdf.numPages};
}

1) Chép đúng nguyên văn: không sửa chính tả, không sửa ngữ pháp, không diễn đạt lại, không thêm hay bớt nội dung.
2) Tuyệt đối không bịa câu hỏi, phương án hay đáp án. Chỗ nào không đọc rõ thì ghi đúng "[không rõ]".
3) Trường ans (đáp án) CHỈ điền khi tài liệu ghi rõ đáp án (bảng đáp án, chữ in đậm đánh dấu **...**, khoanh tròn, dòng "Đáp án: ..."). Nếu tài liệu không có đáp án thì để null. Không được tự giải ở bước này.
4) quote là 6 đến 12 từ đầu tiên của mục, chép đúng nguyên văn từ tài liệu.
5) opts chỉ gồm nội dung từng phương án theo đúng thứ tự, bỏ nhãn "A.", "B."... ans là một chữ cái in hoa (A, B, C, D).
6) Câu đúng/sai: mỗi ý a), b), c), d) là một phần tử trong items; ans là true/false nếu tài liệu có đáp án, nếu không thì null.
7) Câu trả lời ngắn (điền số hoặc từ): đưa vào sa. Câu tự luận: đưa vào essay; answer chỉ điền khi tài liệu có đáp án hoặc gợi ý.
8) Đoạn văn kèm nhóm câu hỏi (điền từ vào chỗ trống, đọc hiểu): đưa vào passages. text là cả đoạn văn, chỗ trống ghi dạng "(1) ______". kind là "cloze" nếu điền chỗ trống, "reading" nếu đọc hiểu.
9) Hình vẽ hoặc bảng không chép được: ghi ngắn trong q dạng "[hình: mô tả ngắn]".
10) Giữ số thứ tự câu trong id (ví dụ "Câu 5" thành "5", "Câu 1.2" thành "1.2").
11) Chữ in đậm trong tài liệu được đánh dấu **...**; hãy bỏ dấu ** khỏi q và opts.
12) notes: liệt kê ngắn các chỗ bạn không chắc hoặc không đọc rõ.
13) subject là tên môn học bạn đoán từ tài liệu (ví dụ "Toán 9"), title là tiêu đề tài liệu.`;
const SYS_SOLVE=`Bạn là giáo viên kiểm tra đáp án cho học sinh Việt Nam. Với mỗi mục trong "tasks":
- Nếu "given" có giá trị: đó là đáp án ghi trong tài liệu gốc. Hãy giải thích vì sao đúng và đặt agrees=true. Chỉ khi bạn chắc chắn đáp án đó SAI thì đặt agrees=false, ghi đáp án bạn cho là đúng vào answer và nêu lí do ngắn.
- Nếu "given" là null: hãy tự giải. answer là chữ cái (câu nhiều lựa chọn), "true" hoặc "false" (đúng/sai), con số (trả lời ngắn), hoặc bài trả lời gợi ý 3 đến 6 ý ngắn (tự luận).
- Không biết hoặc thiếu dữ kiện (ví dụ cần hình vẽ không có): để answer rỗng và confidence "thap". Không được bịa dữ kiện.
- explanation viết bằng tiếng Việt, 1 đến 3 câu, chỉ dựa vào nội dung đề.
- Giữ nguyên "id" của từng mục.`;
async function gem(parts,schema,opt={}){
  if(!aiCfg.key)throw new Error("Chưa nhập khoá Gemini API (mở mục 1 ở trên).");
  const body={contents:[{role:"user",parts}],generationConfig:{temperature:opt.temp??0,responseMimeType:"application/json"}};
  if(schema)body.generationConfig.responseSchema=schema;
  if(opt.sys)body.systemInstruction={parts:[{text:opt.sys}]};
  const url=`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(aiCfg.model)}:generateContent?key=${encodeURIComponent(aiCfg.key)}`;
  let lastErr;
  for(let attempt=0;attempt<4;attempt++){
    try{
      const res=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
      if(res.status===429||res.status>=500){lastErr=new Error(`Gemini báo lỗi ${res.status} (quá tải hoặc hết lượt). Đang thử lại...`);await sleep(1500*(attempt+1));continue}
      const data=await res.json().catch(()=>({}));
      if(!res.ok)throw new Error(data.error&&data.error.message?data.error.message:`Lỗi ${res.status}`);
      const cand=data.candidates&&data.candidates[0];
      if(!cand){throw new Error(data.promptFeedback&&data.promptFeedback.blockReason?"Gemini từ chối nội dung ("+data.promptFeedback.blockReason+")":"Gemini không trả kết quả.")}
      const text=(cand.content&&cand.content.parts||[]).map(p=>p.text||"").join("").replace(/^```json\s*|```\s*$/g,"").trim();
      try{return JSON.parse(text)}
      catch(e){throw new Error(cand.finishReason==="MAX_TOKENS"?"Kết quả bị cắt vì quá dài. Hãy tách file thành các phần nhỏ hơn rồi thử lại.":"Gemini trả về dữ liệu không đúng định dạng.")}
    }catch(e){
      lastErr=e;
      if(/khoá|API key|API_KEY|permission|not found|MAX_TOKENS|cắt|từ chối|định dạng/i.test(e.message))throw e;
      await sleep(1200*(attempt+1));
    }
  }
  throw lastErr||new Error("Không gọi được Gemini.");
}

/* ---- kiểm tra ---- */
const normTxt=s=>String(s||"").toLowerCase().replace(/\*\*/g,"").replace(/[^\p{L}\p{N}]+/gu," ").trim();
function quoteInSource(quote,srcNorm,srcWords){
  const q=normTxt(quote);
  if(!q)return "empty";
  if(srcNorm.includes(q))return "exact";
  const w=q.split(" ").filter(Boolean);
  if(!w.length)return "empty";
  const hit=w.filter(x=>srcWords.has(x)).length;
  return hit/w.length>=0.9?"near":"miss";
}
const stripLabel=o=>String(o).replace(/^\s*[A-Da-d][\.\)]\s+/,"").trim();
function validate(ex,srcText){
  const issues=[];const add=(level,msg)=>issues.push({level,msg});
  const hasSrc=!!srcText;
  const srcNorm=normTxt(srcText),srcWords=new Set(srcNorm.split(" "));
  const chk=(kind,label,item)=>{
    if(!hasSrc)return;
    const r=quoteInSource(item.quote,srcNorm,srcWords);
    item._q=r;
    if(r==="miss")add("warn",`${kind} ${label}: đoạn trích "${String(item.quote).slice(0,60)}" không tìm thấy trong văn bản gốc, có thể AI đã đọc sai hoặc bịa. Hãy kiểm tra.`);
    else if(r==="near")add("info",`${kind} ${label}: đoạn trích chỉ gần khớp văn bản gốc.`);
  };
  (ex.mcq||[]).forEach(q=>{
    chk("Câu",q.id,q);
    if(!q.opts||q.opts.length<2)add("warn",`Câu ${q.id}: có ít hơn 2 phương án.`);
    else if(q.opts.length>6)add("warn",`Câu ${q.id}: có ${q.opts.length} phương án, bất thường.`);
    if(q.ans){const L="ABCDEF".slice(0,(q.opts||[]).length);if(!L.includes(String(q.ans).toUpperCase().trim().charAt(0))){add("warn",`Câu ${q.id}: đáp án "${q.ans}" không nằm trong các phương án, đã bỏ.`);q.ans=null}}
    if((q.opts||[]).some(o=>/\[không rõ\]/.test(o))||/\[không rõ\]/.test(q.q))add("warn",`Câu ${q.id}: có chỗ AI ghi "[không rõ]".`);
  });
  (ex.tf||[]).forEach(g=>{chk("Đúng/sai",g.head,g);if(!g.items||!g.items.length)add("warn",`Đúng/sai "${g.head}": không có ý nào.`)});
  (ex.sa||[]).forEach(q=>chk("Trả lời ngắn",q.id,q));
  (ex.essay||[]).forEach(q=>chk("Tự luận",q.head,q));
  (ex.passages||[]).forEach(p=>{
    chk("Đoạn văn",p.title,p);
    if(p.kind==="cloze"){
      const nb=(p.text.match(/\(\d+\)\s*_+/g)||[]).length;
      if(nb!==p.questions.length)add("warn",`Đoạn "${p.title}": có ${nb} chỗ trống nhưng ${p.questions.length} câu hỏi.`);
    }
    p.questions.forEach((q,i)=>{if(!q.opts||q.opts.length<2)add("warn",`Đoạn "${p.title}", câu ${i+1}: thiếu phương án.`)});
  });
  if(hasSrc){
    const nums=new Set();let m;const re=/(?:^|\n)\s*(?:\*\*)?Câu\s*(\d+)(?:\.\d+)?/gi;
    while((m=re.exec(srcText)))nums.add(+m[1]);
    if(nums.size>=5){
      const got=new Set();
      [...(ex.mcq||[]).map(q=>q.id),...(ex.sa||[]).map(q=>q.id),...(ex.essay||[]).map(q=>q.head),...(ex.tf||[]).map(g=>g.head)].forEach(x=>{const mm=String(x).match(/(\d+)/);if(mm)got.add(+mm[1])});
      const miss=[...nums].filter(n=>!got.has(n)&&n>0);
      if(miss.length)add("warn",`Trong file có "Câu ${miss.slice(0,12).join(", ")}${miss.length>12?"...":""}" nhưng chưa thấy trong kết quả (có thể câu nằm trong đoạn văn hoặc bị bỏ sót).`);
    }
  }else add("info","Tài liệu là ảnh hoặc PDF scan nên chưa đối chiếu được văn bản gốc từng câu. Hãy xem lại kĩ bản nháp.");
  (ex.notes||[]).forEach(n=>add("info","AI ghi chú: "+n));
  return issues;
}

/* ---- giải đáp án và viết gợi ý ---- */
function collectTasks(ex){
  const T=[];
  (ex.mcq||[]).forEach((q,i)=>T.push({key:"m:"+i,kind:"mcq",q:q.q,opts:q.opts.map((o,k)=>"ABCDEF"[k]+". "+o),given:q.ans||null}));
  (ex.tf||[]).forEach((g,i)=>g.items.forEach((it,j)=>T.push({key:`t:${i}:${j}`,kind:"tf",ctx:g.ctx||g.head,q:it.t,given:it.ans===true?"true":it.ans===false?"false":null})));
  (ex.sa||[]).forEach((q,i)=>T.push({key:"s:"+i,kind:"sa",q:q.q,given:q.ans||null}));
  (ex.essay||[]).forEach((q,i)=>T.push({key:"e:"+i,kind:"essay",q:q.q,given:q.answer||null}));
  (ex.passages||[]).forEach((p,i)=>p.questions.forEach((q,j)=>T.push({key:`p:${i}:${j}`,kind:"mcq",ctx:p.text,q:(q.q||"(điền vào chỗ trống số "+(j+1)+")"),opts:q.opts.map((o,k)=>"ABCDEF"[k]+". "+o),given:q.ans||null})));
  return T;
}
async function solveAll(ex,twice){
  const tasks=collectTasks(ex);
  const out={};
  const CH=10;
  for(let i=0;i<tasks.length;i+=CH){
    const chunk=tasks.slice(i,i+CH);
    say(`Giải và viết gợi ý: câu ${i+1} đến ${Math.min(i+CH,tasks.length)} / ${tasks.length}`);
    const payload=[{text:"tasks:\n"+JSON.stringify(chunk.map(t=>({id:t.key,kind:t.kind,context:t.ctx,question:t.q,options:t.opts,given:t.given})))}];
    let a;
    try{a=await gem(payload,SOLVE_SCHEMA,{sys:SYS_SOLVE,temp:0})}catch(e){say("Lỗi khi giải: "+e.message);continue}
    const A={};(a.results||[]).forEach(r=>A[r.id]=r);
    let B={};
    const need=chunk.filter(t=>!t.given);
    if(twice&&need.length){
      try{
        const b=await gem([{text:"Hãy giải lại từ đầu, độc lập, kiểm tra từng phương án rồi mới kết luận.\ntasks:\n"+JSON.stringify(need.map(t=>({id:t.key,kind:t.kind,context:t.ctx,question:t.q,options:t.opts,given:null})))}],SOLVE_SCHEMA,{sys:SYS_SOLVE,temp:0.4});
        (b.results||[]).forEach(r=>B[r.id]=r);
      }catch(e){say("Lần giải thứ hai bị lỗi: "+e.message)}
    }
    chunk.forEach(t=>{out[t.key]={a:A[t.key],b:B[t.key],task:t}});
  }
  return out;
}
const sameAns=(x,y,kind)=>{
  const n=s=>String(s||"").trim().toLowerCase().replace(/,/g,".").replace(/\s+/g,"");
  if(kind==="sa"){const a=parseFloat(n(x)),b=parseFloat(n(y));if(!isNaN(a)&&!isNaN(b))return Math.abs(a-b)<1e-9}
  return n(x)===n(y);
};

/* ---- dựng môn từ kết quả ---- */
function buildSubject(ex,name,fileNames,solved,issues,twice){
  const id="u"+Date.now().toString(36);
  const ref=it=>it.quote?`${it.page?"trang "+it.page+": ":""}"${it.quote}"`:"";
  const flagTxt={
    ai2:"Đáp án do AI giải, hai lần cho cùng kết quả. Nên đối chiếu với thầy cô.",
    ai1:"Đáp án do AI giải (một lần). Nên đối chiếu với thầy cô.",
    none:"Chưa có đáp án: tài liệu không ghi và AI không giải được."
  };
  const apply=(key,given,kind,obj,setAns)=>{
    const r=solved&&solved[key];
    if(!r||!r.a){ if(!given)obj.warn=flagTxt.none; return given||null; }
    const a=r.a;
    if(given){
      obj.hint=a.explanation||"";
      if(a.agrees===false&&a.answer&&!sameAns(a.answer,given,kind))obj.warn=`Cần kiểm tra: đề ghi đáp án ${given}, nhưng AI cho rằng đáp án đúng là ${a.answer}. Lí do AI: ${a.explanation}`;
      return given;
    }
    obj.hint=a.explanation||"";
    const ans=String(a.answer||"").trim();
    if(!ans||a.confidence==="thap"){obj.warn=flagTxt.none+(ans?` (AI nghiêng về "${ans}" nhưng không chắc.)`:"");return null}
    if(twice&&r.b&&r.b.answer){
      if(sameAns(r.b.answer,ans,kind)){obj.warn=flagTxt.ai2;return ans}
      obj.warn=`Cần kiểm tra: hai lần AI giải cho kết quả khác nhau (${ans} và ${r.b.answer}). Mình tạm chọn ${ans}.`;return ans;
    }
    obj.warn=flagTxt.ai1;return ans;
  };
  const s={id,name,draft:true,
    source:"Tạo từ file: "+fileNames.join(", ")+" · AI chép nguyên văn; đáp án lấy theo tài liệu hoặc do AI giải (có nhãn ở từng câu).",
    keyOk:false,tfKeyOk:false,saKeyOk:false,
    mcqTitle:"Trắc nghiệm",tfTitle:"Đúng – Sai",saTitle:"Trả lời ngắn",
    passTitle:"Bài điền từ và bài đọc theo đoạn văn",
    keyNote:"Đây là bản nháp do AI tạo từ file của bạn. Câu hỏi được chép nguyên văn; câu nào có nhãn \"Cần kiểm tra\" hoặc \"do AI giải\" thì đáp án chưa chắc đúng. Gợi ý và giải thích do AI viết. Bấm \"✎ Chỉnh sửa\" để sửa từng câu, đối chiếu rồi bấm \"Lưu vào bộ ôn\".",
    keyWarn:issues.filter(x=>x.level==="warn").slice(0,6).map(x=>x.msg).join(" "),
    mcq:[],tf:[],sa:[],essay:[],passages:[]};
  (ex.mcq||[]).forEach((q,i)=>{
    const o={id:q.id,q:q.q,opts:q.opts.map(stripLabel),ans:"",hint:"",srcRef:ref(q)};
    if(q.note)o.note=q.note;
    const a=apply("m:"+i,q.ans?String(q.ans).toUpperCase().trim().charAt(0):null,"mcq",o);
    o.ans=a||"";s.mcq.push(o);
  });
  (ex.tf||[]).forEach((g,i)=>{
    const grp={head:g.head,items:[],srcRef:ref(g)};if(g.ctx)grp.ctx=g.ctx;
    g.items.forEach((it,j)=>{
      const o={t:it.t,ans:false,hint:""};
      const given=it.ans===true?"true":it.ans===false?"false":null;
      const a=apply(`t:${i}:${j}`,given,"tf",o);
      if(a===null){o.ans=false;o.warn=(o.warn||"")+" (Tạm để Sai.)"}else o.ans=(a==="true");
      grp.items.push(o);
    });
    s.tf.push(grp);
  });
  (ex.sa||[]).forEach((q,i)=>{const o={id:q.id,q:q.q,ans:"",hint:"",srcRef:ref(q)};const a=apply("s:"+i,q.ans||null,"sa",o);o.ans=a||"";s.sa.push(o)});
  (ex.essay||[]).forEach((q,i)=>{
    const o={head:q.head,q:q.q,plain:true,a:[],srcRef:ref(q)};
    const r=solved&&solved["e:"+i];
    if(q.answer){o.a=[q.answer];o.aLabel="Đáp án trong tài liệu:";if(r&&r.a&&r.a.explanation)o.warn="Giải thích của AI: "+r.a.explanation}
    else if(r&&r.a&&r.a.answer){o.a=[r.a.answer];o.own=true;o.aLabel="Tài liệu không có đáp án. Gợi ý do AI viết:";o.warn="Gợi ý do AI viết, cần đối chiếu với thầy cô."}
    else{o.a=["(Chưa có đáp án)"];o.aLabel="Chưa có đáp án:"}
    s.essay.push(o);
  });
  (ex.passages||[]).forEach((p,i)=>{
    const ps={id:"P"+(i+1),title:p.title,instr:p.instr||"",kind:p.kind,text:p.text,srcRef:ref(p),questions:[]};
    p.questions.forEach((q,j)=>{
      const o={opts:(q.opts||[]).map(stripLabel),ans:"",hint:""};if(q.q)o.q=q.q;
      const a=apply(`p:${i}:${j}`,q.ans?String(q.ans).toUpperCase().trim().charAt(0):null,"mcq",o);
      o.ans=a||"";ps.questions.push(o);
    });
    s.passages.push(ps);
  });
  return s;
}

/* ---- quy trình chính ---- */
async function runImport(){
  if(imp.busy)return;
  if(!imp.files.length){alert("Hãy chọn ít nhất một file.");return}
  if(!aiCfg.key){alert("Hãy nhập khoá Gemini API ở mục 1 rồi bấm Lưu.");return}
  imp.busy=true;imp.log=[];imp.issues=[];
  const logEl=document.getElementById("impLog");if(logEl)logEl.replaceChildren();
  const btn=document.getElementById("impRun");if(btn){btn.disabled=true;btn.textContent="Đang phân tích..."}
  try{
    const texts=[],images=[],pdfs=[];
    for(const f of imp.files){
      const ext=fileExt(f.name);
      say(`Đọc file: ${f.name}`);
      if(["md","markdown","txt"].includes(ext))texts.push({name:f.name,text:await readText(f)});
      else if(ext==="docx")texts.push({name:f.name,text:await docxToText(f)});
      else if(ext==="pdf"){
        try{
          const r=await pdfToText(f);
          if(r.scanned){say(`  ${f.name}: PDF dạng ảnh scan (${r.pages} trang), sẽ nhờ Gemini đọc trực tiếp.`);pdfs.push(f)}
          else{say(`  ${f.name}: đọc được lớp chữ của ${r.pages} trang.`);texts.push({name:f.name,text:r.text})}
        }catch(e){say(`  Không đọc được lớp chữ (${e.message}); sẽ gửi PDF cho Gemini đọc.`);pdfs.push(f)}
      }else if((f.type||"").startsWith("image/")||["jpg","jpeg","png","webp","heic"].includes(ext))images.push(f);
      else say(`  Bỏ qua file không hỗ trợ: ${f.name}`);
    }
    const parts=[];  // mỗi phần tử: {parts:[...], label}
    texts.forEach(t=>{
      const MAXC=38000;
      if(t.text.length<=MAXC)parts.push({label:t.name,parts:[{text:`Tài liệu "${t.name}":\n\n${t.text}`}]});
      else{
        let rest=t.text,k=1;
        while(rest.length){
          let cut=Math.min(MAXC,rest.length);
          if(cut<rest.length){const p=rest.lastIndexOf("\n",cut);if(p>MAXC*0.6)cut=p}
          parts.push({label:`${t.name} (phần ${k++})`,parts:[{text:`Tài liệu "${t.name}" (một phần, có thể bắt đầu hoặc kết thúc giữa chừng):\n\n${rest.slice(0,cut)}`}]});
          rest=rest.slice(cut);
        }
      }
    });
    for(const f of pdfs)parts.push({label:f.name,parts:[{text:`Tài liệu PDF "${f.name}" (dạng ảnh scan). Hãy chép nội dung.`},{inline_data:{mime_type:"application/pdf",data:bufToB64(await readBuf(f))}}]});
    for(let i=0;i<images.length;i+=4){
      const grp=images.slice(i,i+4),ps=[{text:`Các ảnh sau là ảnh chụp trang ${i+1} đến ${i+grp.length} của cùng một tài liệu, theo thứ tự.`}];
      for(const f of grp)ps.push({inline_data:{mime_type:"image/jpeg",data:await imgToB64(f)}});
      parts.push({label:`ảnh ${i+1}-${i+grp.length}`,parts:ps});
    }
    const ex={subject:"",title:"",mcq:[],tf:[],sa:[],essay:[],passages:[],notes:[]};
    for(let i=0;i<parts.length;i++){
      say(`Chép nguyên văn (${i+1}/${parts.length}): ${parts[i].label}`);
      const r=await gem(parts[i].parts,EXTRACT_SCHEMA,{sys:SYS_EXTRACT,temp:0});
      if(!ex.subject)ex.subject=r.subject||"";if(!ex.title)ex.title=r.title||"";
      ["mcq","tf","sa","essay","passages","notes"].forEach(k=>{(r[k]||[]).forEach(x=>ex[k].push(x))});
    }
    ex.mcq.forEach(q=>q.opts=(q.opts||[]).map(stripLabel));
    const srcText=(images.length||pdfs.length)?"":texts.map(t=>t.text).join("\n");
    imp.issues=validate(ex,srcText);
    say(`Đã chép: ${ex.mcq.length} câu trắc nghiệm, ${ex.tf.length} nhóm đúng/sai, ${ex.sa.length} trả lời ngắn, ${ex.essay.length} tự luận, ${ex.passages.length} đoạn văn.`);
    let solved=null;
    if(imp.useSolver)solved=await solveAll(ex,imp.twice);
    const name=(imp.name||ex.subject||ex.title||"Môn mới").trim();
    const s=buildSubject(ex,name,imp.files.map(f=>f.name),solved,imp.issues,imp.twice);
    SUBJECTS.push(s);initSubjectState(s);
    view.subj=s.id;view.mode="study";view.main="mcq";
    say("Xong. Đang mở bản nháp để bạn xem lại.");
    renderTabs();renderPanel();window.scrollTo(0,0);
  }catch(e){
    say("Lỗi: "+e.message);
    imp.issues.push({level:"warn",msg:e.message});
    const box=document.getElementById("impIssues");if(box)drawIssues(box);
  }finally{
    imp.busy=false;
    const b=document.getElementById("impRun");if(b){b.disabled=false;b.textContent="Phân tích và tạo bản nháp"}
  }
}

async function importSubjectFile(f){

      if(a<0||b<0)throw new Error("Không tìm thấy dữ liệu môn trong file này.");
      arr=new Function(text.slice(a,b+3)+"; return SUBJECTS;")();
    }
  }catch(e){alert("Không nhập được: "+e.message);return}
  if(!Array.isArray(arr))arr=[arr];
  let n=0;

}

  const f=document.createDocumentFragment();

}

/* ---- thanh tab ---- */
function mainTabList(){
  const c=cur()||{}, l=[];
  const hasQuiz=(c.mcq&&c.mcq.length)||(c.passages&&c.passages.length)||(c.tf&&c.tf.length)||(c.sa&&c.sa.length)||(c.qa&&c.qa.length);
  if(c.docHieu)l.push(["dochieu","Đọc hiểu"]);
  if(hasQuiz||(!c.docHieu&&!(c.essay&&c.essay.length)))l.push(["mcq","Trắc nghiệm"]);
  if((c.essay&&c.essay.length)||(!c.docHieu&&!hasQuiz))l.push(["essay","Tự luận"]);
  if(c.writing)l.push(["writing","Writing"]);

}
function renderTabs(){

function isOkMcq(q,l){return l===q.ans||(q.alt||[]).includes(l);}
function checkSa(q,v){
  const norm=x=>parseFloat(String(x).replace(/\s/g,"").replace(",","."));
  const n=norm(v);
  if(isNaN(n))return false;
  return [q.ans,...(q.alt||[])].some(a=>Math.abs(norm(a)-n)<1e-9);
}
function tableEl(t){

}

  function mcqCard(i){

    const q=s.qa[i], mark=st.qa.mark[i], shown=!!st.qa.shown[i];
    const card=h("div",{class:"card"+(mark==="ok"?" qa-ok":mark==="no"?" qa-no":"")});
    card.append(h("p",{class:"qtext"},h("span",{class:"qno"},`Câu ${q.id}: `),q.q));
    if(q.note)card.append(h("p",{class:"part-desc"},q.note));
    if(q.warn)card.append(h("div",{class:"note"},q.warn));
    card.append(h("div",{class:"tools"},
      h("button",{class:"hint-btn","aria-expanded":shown,onclick:()=>{st.qa.shown[i]=!shown;redrawQa(i)}},shown?"Ẩn đáp án":"Xem đáp án"),
      h("button",{class:"hint-btn",onclick:()=>{st.qa.hint[i]=!st.qa.hint[i];redrawQa(i)}},st.qa.hint[i]?"Ẩn gợi ý":"Gợi ý")));
    if(shown){
      card.append(h("div",{class:"answer-box"+(q.own?" own":"")},h("p",{class:"pl"},q.a),q.own?h("small",{},"Đáp án do Claude tự tính, không có trong đề cương."):null));
      card.append(h("div",{class:"tools"},
        h("button",{class:"btn"+(mark==="ok"?" primary":""),onclick:()=>{st.qa.mark[i]="ok";redrawQa(i);updateScore()}},"Đã nhớ"),
        h("button",{class:"btn"+(mark==="no"?" primary":""),onclick:()=>{st.qa.mark[i]="no";redrawQa(i);updateScore()}},"Chưa nhớ")));
    }
    if(st.qa.hint[i]){
      card.append(h("div",{class:"hint"},h("strong",{},"Gợi ý: "),q.hint,h("small",{},"Gợi ý do Claude viết, không có trong đề cương.")));
    }
    return decorate(card,s,"qa",i,()=>redrawQa(i),()=>{redrawQa(i);updateScore()});
  }
  function redrawQa(i){
    const old=qaWrap.querySelector(`[data-q="${i}"]`);
    const n=qaCard(i); n.dataset.q=i; old.replaceWith(n);
  }
  function drawQa(){
    if(qaToggle)qaToggle.textContent=st.qa.only?"Hiện tất cả câu":"Chỉ ôn câu chưa nhớ";
    const list=st.qa.order.filter(i=>!(st.qa.only&&st.qa.mark[i]==="ok"));
    qaWrap.replaceChildren(...(list.length?list.map(i=>{const c=qaCard(i);c.dataset.q=i;return c}):[h("div",{class:"empty"},"Không còn câu nào chưa nhớ. Bấm Làm lại từ đầu để ôn lại.")]));
  }

  function passCard(pi){
    const ps=s.passages[pi], reveal=!!st.ps.reveal[pi];
    const card=h("div",{class:"card pcard"});
    card.append(h("p",{class:"qtext"},h("span",{class:"qno"},ps.title)));
    if(ps.instr)card.append(h("p",{class:"part-desc"},ps.instr));
    const body=h("div",{class:"passage"});
    ps.text.split("\n").forEach(par=>{
      if(!par.trim())return;
      const p=h("p",{class:"ptext"});
      par.split(/(\(\d+\)\s*_+)/).forEach(seg=>{
        const m=seg.match(/^\((\d+)\)\s*_+$/);
        if(m){
          const qi=+m[1]-1, q=ps.questions[qi], pick=st.ps.picked[pi+"-"+qi];
          let cls="blank", txt=`(${m[1]}) ______`;
          if(q&&pick){cls+=pick===q.ans?" ok":" bad";txt=`(${m[1]}) `+q.opts[LET.indexOf(pick)];}
          else if(q&&reveal){cls+=" rev";txt=`(${m[1]}) `+q.opts[LET.indexOf(q.ans)];}
          p.append(h("span",{class:cls},txt));
        }else p.append(document.createTextNode(seg));
      });
      body.append(p);
    });
    card.append(body);
    ps.questions.forEach((q,qi)=>{
      const key=pi+"-"+qi, picked=st.ps.picked[key], done=picked!=null;
      const blk=h("div",{class:"qblock"});
      blk.append(h("p",{class:"qtext"},h("span",{class:"qno"},`Question ${qi+1}`+(q.q?": ":"")),q.q||""));
      const opts=h("div",{class:"opts"});
      q.opts.forEach((t,k)=>{
        const L=LET[k]; let cls="opt";
        if(done||reveal){
          if(L===q.ans)cls+=" right";
          else if(L===picked)cls+=" wrong";
          else cls+=" faded";
        }
        opts.append(h("button",{class:cls,disabled:done,onclick:()=>{st.ps.picked[key]=L;redrawPs(pi);updateScore()}},h("span",{class:"letter"},L+"."),h("span",{},t)));
      });
      blk.append(opts);
      if(q.warn)blk.append(h("div",{class:"note"},q.warn));
      if(done){const ok=picked===q.ans;blk.append(h("p",{class:"result "+(ok?"ok":"bad")},resText(ok,q.ans)));}
      blk.append(h("div",{class:"tools"},h("button",{class:"hint-btn",onclick:()=>{st.ps.hint[key]=!st.ps.hint[key];redrawPs(pi)}},st.ps.hint[key]?"Ẩn gợi ý":"Gợi ý")));
      if(st.ps.hint[key]||reveal)blk.append(h("div",{class:"hint"},h("strong",{},`Đáp án: ${q.ans}. `),q.hint,h("small",{},"Đáp án và giải thích do Claude làm, không có trong đề cương.")));
      card.append(blk);
    });
    card.append(h("div",{class:"tools"},h("button",{class:"btn",onclick:()=>{st.ps.reveal[pi]=!reveal;redrawPs(pi)}},reveal?"Ẩn đáp án cả đoạn":"Xem đáp án cả đoạn")));
    return decorate(card,s,"ps",pi,()=>redrawPs(pi),()=>{redrawPs(pi);updateScore()});
  }
  function redrawPs(pi){
    const old=psWrap.querySelector(`[data-p="${pi}"]`);
    const n=passCard(pi); n.dataset.p=pi; old.replaceWith(n);
  }

  function drawAll(){
    mcqWrap.replaceChildren(...st.mcq.order.map(i=>{const c=mcqCard(i);c.dataset.i=i;return c}));
    tfWrap.replaceChildren(...st.tf.order.map(g=>{const c=tfCard(g);c.dataset.g=g;return c}));
    saWrap.replaceChildren(...st.sa.order.map(i=>{const c=saCard(i);c.dataset.s=i;return c}));
    psWrap.replaceChildren(...s.passages.map((_,i)=>{const c=passCard(i);c.dataset.p=i;return c}));
    if(s.qa.length)drawQa();
    updateScore();
  }
  drawAll();
  return root;
}

/* ===================== TỰ LUẬN ===================== */
function buildEssay(){
  const s=cur(), st=state[s.id].essay;
  const root=h("div");
  root.append(h("p",{class:"source"},s.source));
  if(!s.essay.length){root.append(h("div",{class:"empty"},"Đề cương môn này chưa có phần tự luận."));return root;}
  const own=s.essay.filter(e=>e.own).length;
  root.append(h("div",{class:"note green"},
    own===0
      ? "Tất cả câu tự luận của môn này đều có đáp án sẵn trong đề cương, giữ nguyên văn. Chưa có câu nào do Claude tự làm."
      : `Có ${own} câu do Claude tự làm đáp án vì đề cương chưa có, được đánh dấu màu tím. Các câu còn lại giữ nguyên theo đề cương.`));
  const bar=h("div",{class:"scorebar"},
    h("span",{class:"stat"},"Tự luận: nên tự viết nháp trước rồi mới mở đáp án."),
    h("span",{class:"sp"}),
    h("button",{class:"btn",onclick:()=>{s.essay.forEach((_,i)=>st.shown[i]=true);renderPanel()}},"Hiện tất cả"),
    h("button",{class:"btn",onclick:()=>{st.shown={};renderPanel()}},"Ẩn tất cả"));
  root.append(bar);

  const egrid=h("div",{class:"cardgrid"});root.append(egrid);
  s.essay.forEach((e,i)=>{
    const card=h("div",{class:"card"});
    card.append(h("p",{class:"qtext"},
      h("span",{class:"qno"},e.head+": "),e.q,
      e.own?h("span",{class:"tag-claude"},"Claude tự làm"):h("span",{class:"tag-src"},e.tag||"Đáp án theo đề cương")));
    if(e.qTable)card.append(tableEl(e.qTable));
    if(e.qAfter)card.append(h("p",{class:"qtext"},e.qAfter));
    if(e.qPre)card.append(h("pre",{class:"tree"},e.qPre));
    if(e.qNote)card.append(h("p",{class:"qtext"},h("em",{},e.qNote)));
    const shown=!!st.shown[i];
    card.append(h("div",{class:"tools"},
      h("button",{class:"hint-btn","aria-expanded":shown,onclick:()=>{st.shown[i]=!shown;renderPanel()}},shown?"Ẩn đáp án":"Xem đáp án")));
    if(shown){
      const box=h("div",{class:"answer-box"+(e.own?" own":"")});
      const multi=e.a.length>1;
      if(e.aLabel)box.append(h("p",{class:"answer-label"},e.aLabel));
      if(e.plain){
        e.a.forEach(x=>box.append(h("p",{class:"pl"},x)));
      }else if(e.ordered){
        box.append(h("ol",{class:"answer-list"},e.a.map(x=>h("li",{},x))));
      }else if(multi && e.a.every(x=>x.length<260) && !e.qNote){
        box.append(h("ul",{class:"answer-list"},e.a.map(x=>h("li",{},x))));
      }else{
        e.a.forEach(x=>box.append(h("p",{},"- "+x)));
      }
      if(e.aTable)box.append(tableEl(e.aTable));
      if(e.after)box.append(h("p",{},h("em",{},e.after)));
      if(e.warn)box.append(h("p",{class:"warn"},h("strong",{},"Lưu ý của Claude: "),e.warn));
      card.append(box);
    }
    egrid.append(decorate(card,s,"essay",i,renderPanel));
  });
  return root;
}

(function uiControls(){
  const KEY="onthi-ui:v2";let cfg={fs:18,serif:false};
  try{Object.assign(cfg,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){}
  const root=document.documentElement;
  function apply(){root.style.setProperty("--fs",cfg.fs+"px");document.body.classList.toggle("serif",!!cfg.serif);try{localStorage.setItem(KEY,JSON.stringify(cfg))}catch(e){}}
  const ctl=h("span",{class:"fsctl"},
    h("button",{class:"btn",type:"button",title:"Chữ nhỏ hơn",onclick:()=>{cfg.fs=Math.max(14,cfg.fs-1);apply()}},"A−"),
    h("button",{class:"btn",type:"button",title:"Chữ to hơn",onclick:()=>{cfg.fs=Math.min(30,cfg.fs+1);apply()}},"A+"),
    h("button",{class:"btn",type:"button",title:"Đổi kiểu chữ ở khung đọc bài (không chân / có chân)",onclick:()=>{cfg.serif=!cfg.serif;apply()}},"Aa"));
  const et=document.getElementById("editToggle");et.parentNode.insertBefore(ctl,et);
  apply();
  const hd=document.querySelector("header.top");
  const setHH=()=>root.style.setProperty("--hh",hd.offsetHeight+"px");
  setHH();
  if(window.ResizeObserver)new ResizeObserver(setHH).observe(hd);
  window.addEventListener("resize",setHH);
})();
